[project]
name = "hlx-arbitrage-engine"
version = "0.1.0"
description = "Fee-aware arbitrage research, simulation, risk and execution engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "numpy>=2.0",
  "pandas>=2.2",
]

[project.scripts]
hlx-engine = "hlx_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
